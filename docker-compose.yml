
services:
  database:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db_perfumes_data:/var/lib/postgresql/data
    healthcheck:
      # TCP evita detectar el servidor temporal de inicialización (solo socket Unix).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 1s
      timeout: 5s
      retries: 60

volumes:
  db_perfumes_data:
