<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alta de usuario</title>
  <link rel="stylesheet" href="usuario.css">
</head>
<body>
  <main>
    <p class="eyebrow">Tienda de perfumes</p>
    <h1>Crear usuario</h1>
    <p class="intro">Registrate para guardar tus fragancias favoritas y gestionar tus compras.</p>
    <form action="/usuario" method="post">
      <label>
        Email
        <input type="email" name="email" autocomplete="email" maxlength="255" required>
      </label>
      <label>
        Contraseña
        <input type="password" name="contrasena" autocomplete="new-password" minlength="8" required>
        <small>Debe tener al menos 8 caracteres.</small>
      </label>
      <button type="submit">Dar de alta</button>
    </form>
  </main>
</body>
</html>
